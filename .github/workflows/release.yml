# The version of Hippocampe, decided by what was merged.
#
# `package.json` stays at 0.0.0 and nobody edits a version by hand: the tag semantic-release
# puts on a branch is the version. No plugin here writes a commit, so the history of a branch is
# what was merged into it and nothing the pipeline added afterwards.
#
# Only `main` publishes: merging `dev` into `main` (a merge commit, never a squash) publishes
# `vX.Y.Z`, read from the subjects of the squashed pull requests it brings. `dev` publishes
# nothing: it is the integration branch. Hippocampe starts in `0.x`. Breaking changes move the minor: a
# 2.0 is a decision, not something a commit message brings about.

name: release

on:
  push:
    branches: [main]
  # A dry run of the viewer's build on a tag that exists: nothing is tagged, both archives are
  # attached to that tag's release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build the viewer from, such as v0.4.0'
        required: true

# One release at a time per branch, in the order of the pushes: two tags are never computed
# from the same history.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'push'
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        if: github.event_name == 'push'
      - name: Tag what was merged, and write the release notes
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      # The tag semantic-release just put on this commit, if it made one; or the one asked for.
      - name: The tag to build the viewer from
        id: tag
        env:
          ASKED: ${{ inputs.tag }}
        run: |
          if [ -n "$ASKED" ]; then tag=$ASKED; else tag=$(git tag --points-at HEAD --list 'v*' | head -n 1); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The desktop viewer, built from the tag on Linux and on Windows, attached to its release with a
  # checksum each. No tag, nothing built.
  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      # What GPUI needs on Linux to build the desktop app (as in ci.yml).
      - name: Install the libraries of the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      # rustup installs the Rust of rust-toolchain.toml.
      - name: Build the viewer, which takes its version from the tag
        run: HIPPOCAMPE_VERSION="${TAG#v}" cargo build --locked --release -p app
      - name: Pack it with its checksum
        id: pack
        run: echo "archive=$(scripts/package.sh "${TAG#v}" ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - name: Attach both to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  # The Android app of the tag: an APK signed with the key the repository's secrets hold, attached
  # to its release beside the viewer with its checksum. Until those secrets are set, the job says so
  # in one line and attaches nothing, and the release does not fail for it.
  android:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      # A tag cut before the Android app has no apps/android: nothing to build either.
      - name: Whether there is an APK to sign
        id: signing
        run: |
          if [ ! -f apps/android/gradlew ]; then
            echo "::notice::$TAG has no Android app: no APK is attached."
          elif [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::notice::The Android signing secrets are not set: no APK is attached to $TAG."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21.0.12+8
          cache: gradle
      - name: Build the APK, which takes its version from the tag, signed
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" HIPPOCAMPE_VERSION="${TAG#v}" ./gradlew assembleRelease
          rm "$RUNNER_TEMP/release.jks"
      - name: Attach it to the release with its checksum
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="hippocampe-android-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber

  # The npm package of the tag: the executable of Linux x64, then the launcher that needs it
  # (`npm i -g @netsirk/hippocampe`). Only a release from a push to `main` publishes, never the dry run
  # of the viewer. Nothing is published before both tarballs are installed and answer /health with
  # the tag's version. Publication goes through npm's trusted publishing (OIDC, with provenance):
  # no token is kept; see docs/install.md for what the owner sets up once on npmjs.com. A version
  # already on npm is skipped, so a re-run finishes what a failed run left, and a version older
  # than the one `latest` names is published as `previous`, never moving `latest` back; the
  # launcher is never published without its executable.
  npm:
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/server
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Pack both packages
        run: bun scripts/pack.ts "${TAG#v}" "$RUNNER_TEMP/npm"
      - name: Prove them before anything is published
        run: scripts/prove-package.sh "${TAG#v}" "$RUNNER_TEMP/npm"
      - name: Publish the executable, then the launcher that needs it
        run: |
          version="${TAG#v}"
          publish() {
            if npm view "$1@$version" version >/dev/null 2>&1; then
              echo "$1@$version is on npm already: skipped."
              return
            fi
            # What `latest` names: nothing for a package never published (E404). A re-run of an
            # older release must not move `latest` back, so a version older than it is published
            # as `previous`; any other failure of the registry stops here.
            if ! latest=$(npm view "$1" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err"); then
              grep -q E404 "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err" >&2; return 1; }
              latest=
            fi
            tag=latest
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              tag=previous
            fi
            npm publish "$2" --provenance --access public --tag "$tag"
          }
          publish @netsirk/hippocampe-linux-x64 "$RUNNER_TEMP/npm/netsirk-hippocampe-linux-x64-$version.tgz"
          # The registry may take minutes to show what was just published (more than 150 s for 0.8.0).
          waited=0
          until npm view "@netsirk/hippocampe-linux-x64@$version" version >/dev/null 2>&1; do
            if [ "$waited" -ge 600 ]; then
              echo "::error::The executable of $version is not on npm after waiting $waited s: the launcher is not published."
              exit 1
            fi
            sleep 10
            waited=$((waited + 10))
          done
          publish @netsirk/hippocampe "$RUNNER_TEMP/npm/netsirk-hippocampe-$version.tgz"
